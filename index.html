<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Enlazamos los estilos de styles.css -->
    <link rel="stylesheet" href="styles.css">

    <!-- CORRECCIÓN: Librerías reales de Firebase v8 enlazadas correctamente -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>
    <div class="login-box">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="correo@ejemplo.com">

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required placeholder="******">

            <button type="button" onclick="login()">Ingresar</button>
        </form>
        <p>¿No tienes cuenta? <a href="Registro.html">Regístrate aquí</a></p>
    </div>

    <!-- CORRECCIÓN: Quitamos type="module" para que sea compatible con la función login() -->
    <script src="auth.js"></script>
</body>
</html>
