<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - H. Ayuntamiento de Calnali</title>
    <link rel="stylesheet" href="styles.css">

    <!-- LIBRERÍAS OFICIALES DE GOOGLE FIREBASE (ORDEN ESTRICTO OBLIGATORIO) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

 


</head>
<body>
    <div class="main-container">
        <div class="login-card">
            
            <!-- PANEL IZQUIERDO: Formulario -->
            <div class="left-panel">
                <div class="header-logo">
                    <img src="logo.png" alt="Juntos Rescatando Calnali" class="logo-img">
                    <div class="logo-text">
                        <span class="logo-top">JUNTOS RESCATANDO</span>
                        <span class="logo-bottom">CALNALI</span>
                    </div>
                </div>

                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Use su correo y contraseña</p>

                <form id="loginForm" onsubmit="event.preventDefault();"> <!--  OPTIMIZACIÓN: Evita recargas erróneas -->
                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" required placeholder="Email" autocomplete="username">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" required placeholder="Password" autocomplete="current-password">
                    </div>

                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                    <button type="button" class="btn-primary" onclick="login()">INICIAR SESIÓN</button>
                </form>

                <footer class="card-footer">
                    H. AYUNTAMIENTO 2024-2027
                </footer>
            </div>

            <!-- PANEL DERECHO: Bienvenida Institucional Limpia -->
            <div class="right-panel">
                <div class="welcome-content">
                    <h1>¡Bienvenido!</h1>
                    <p>Sistema Interno de Gestión de Mantenimiento y Control Tecnológico Municipal.</p> <!--  CORREGIDO: Botón de registro eliminado -->
                </div>
            </div>

        </div>
    </div>

    <!-- Lógica de control institucional -->
    <script src="auth.js"></script>
</body>
</html>
