<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - H. Ayuntamiento de Calnali</title>
    <link rel="stylesheet" href="styles.css">

    <!-- LIBRERÍAS OFICIALES DE GOOGLE FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- Tu tercera línea armada manualmente de firestore va aquí abajo si la vas a usar -->
</head>
<body>
    <div class="main-container">
        <div class="login-card">
            
            <!-- PANEL IZQUIERDO: Formulario -->
            <div class="left-panel">
                <div class="header-logo">
                    <!-- Puedes cambiar 'logo.png' por la ruta real de tu imagen del escudo de Calnali -->
                    <img src="logo.png" alt="Juntos Rescatando Calnali" class="logo-img">
                    <div class="logo-text">
                        <span class="logo-top">JUNTOS RESCATANDO</span>
                        <span class="logo-bottom">CALNALI</span>
                    </div>
                </div>

                <h2>Iniciar Sesión</h2>
                <p class="subtitle">Use su correo y contraseña</p>

                <form id="loginForm">
                    <div class="input-group">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" required placeholder="Email">
                    </div>

                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" required placeholder="Password">
                    </div>

                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                    <button type="button" class="btn-primary" onclick="login()">INICIAR SESIÓN</button>
                </form>

                <footer class="card-footer">
                    H. AYUNTAMIENTO 2024-2027
                </footer>
            </div>

            <!-- PANEL DERECHO: Bienvenida Institucional -->
            <div class="right-panel">
                <div class="welcome-content">
                    <h1>¡Bienvenido!</h1>
                    <p>Ingrese sus datos personales para usar todas las funciones del sitio</p>
                    <a href="registro.html" class="btn-outline">Registrarse</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Lógica de control -->
    <script src="auth.js"></script>
</body>
</html>
