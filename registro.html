<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="register-box">
        <h2>Crear Cuenta Nueva</h2>
        <form id="registerForm">
            <label for="cedula">Cédula de Identidad:</label>
            <input type="text" id="cedula" required placeholder="Ej. 12345678">

            <label for="fullName">Nombre Completo:</label>
            <input type="text" id="fullName" required placeholder="Ej. Juan Pérez">

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" required placeholder="correo@empresa.com">

            <label key="pass" for="password">Contraseña (Mínimo 6 caracteres):</label>
            <input type="password" id="password" required placeholder="******">

            <label for="role">Rol asignado en el sistema:</label>
            <select id="role" required>
                <option value="" disabled selected>Seleccione un rol...</option>
                <option value="director">Director</option>
                <option value="administrador">Administrador</option>
                <option value="encargado">Encargado</option>
            </select>

            <button type="button" onclick="registerUser()">Registrar Usuario</button>
        </form>
        <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </div>

    <!-- ENLACES REALES COMPLETOS DE FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>      
    <!-- Tu lógica de control -->
    <script src="auth.js"></script>
</body>
</html>
