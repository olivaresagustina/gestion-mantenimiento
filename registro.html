<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios - H. Ayuntamiento de Calnali</title>
    <!-- Importación de tipografía y FontAwesome para los iconos de los inputs -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Contenedor Principal de la Tarjeta */
        .main-container {
            width: 100%;
            max-width: 1020px;
        }

        .login-card {
            background: #fbf6ee; /* Fondo beige claro institucional */
            display: flex;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            min-height: 620px;
        }

        /* --- PANEL IZQUIERDO (Formulario de Registro) --- */
        .left-panel {
            flex: 1.3;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Logotipo Institucional */
        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            align-self: flex-start;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 110px;
            height: auto;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.1;
        }

        .logo-top {
            font-size: 10px;
            font-weight: 600;
            color: #8c6239;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-bottom {
            font-size: 22px;
            font-weight: 700;
            color: #b8904c; /* Dorado */
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Títulos del Formulario */
        .left-panel h2 {
            color: #5c1424; /* Guinda institucional */
            font-size: 32px;
            font-weight: 700;
            margin-top: 5px;
            text-align: center;
        }

        .subtitle {
            color: #636363;
            font-size: 13px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 500;
        }

        #registerForm {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
        }

        /* Campos de entrada con icono */
        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 15px;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #8c6239;
            font-size: 16px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 15px 12px 50px;
            border: 1.5px solid #cccccc;
            border-radius: 10px;
            background: #ffffff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            color: #333;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #5c1424;
            box-shadow: 0 0 5px rgba(92, 20, 36, 0.15);
        }

        .label-select {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            text-align: left;
        }

        /* Botón Registrarse (Guinda) */
        .btn-primary {
            background: #5c1424;
            color: #ffffff;
            border: none;
            padding: 13px 0;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 15px;
            text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(92, 20, 36, 0.2);
        }

        .btn-primary:hover {
            background: #440e1a;
            transform: translateY(-1px);
        }

        /* --- PANEL DERECHO (Bienvenida Guinda con curva ovalada) --- */
        .right-panel {
            flex: 1;
            background: #5c1424; /* Fondo guinda */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            /* Efecto de curva ovalada exacta del lado izquierdo del panel */
            border-top-left-radius: 100% 50%;
            border-bottom-left-radius: 100% 50%;
        }

        .welcome-content {
            text-align: center;
            color: #ffffff;
            max-width: 280px;
            z-index: 2;
        }

        .welcome-content h1 {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .welcome-content p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
            opacity: 0.85;
        }

        /* Botón Iniciar Sesión (Dorado con Hover Transparente) */
        .btn-outline {
            display: inline-block;
            border: 2px solid #b8904c;
            background: #b8904c;
            color: #ffffff;
            padding: 12px 40px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-outline:hover {
            background: transparent;
            color: #b8904c;
            transform: translateY(-2px);
        }

        .institutional-text {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            color: #ffffff;
            opacity: 0.6;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Ajustes responsivos para dispositivos móviles */
        @media (max-width: 850px) {
            .login-card {
                flex-direction: column;
            }
            .right-panel {
                border-radius: 0;
                padding: 60px 20px;
                order: 2;
            }
            .left-panel {
                order: 1;
                padding: 40px 25px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="login-card">
            
            <!-- PANEL IZQUIERDO: Formulario de Registro -->
            <div class="left-panel">
                <!-- Encabezado con Logotipo -->
                <div class="header-logo">
                    <img src="logo.png" alt="Logo Calnali" class="logo-img">
                    <div class="logo-text">
                        <span class="logo-top">Juntos Rescatando</span>
                        <span class="logo-bottom">Calnali</span>
                    </div>
                </div>

                <!-- Títulos -->
                <div>
                    <h2>Crear Cuenta Nueva</h2>
                    <p class="subtitle">Por favor ingrese sus datos completos para registrarse</p>
                </div>

                <!-- Formulario -->
                <form id="registerForm">
                    <!-- Campo Cédula -->
                    <div class="input-group">
                        <i class="fa-solid fa-id-card input-icon"></i>
                        <input type="text" id="cedula" required placeholder="Cédula de Identidad: Ej. 12345678">
                    </div>

                    <!-- Campo Nombre Completo -->
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="fullName" required placeholder="Nombre Completo: Ej. Juan Pérez">
                    </div>

                    <!-- Campo Correo Electrónico -->
                    <div class="input-group">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="email" required placeholder="Correo Electrónico: correo@empresa.com">
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" required placeholder="Contraseña (Mínimo 6 caracteres): ******">
                    </div>

                    <!-- Selector de Rol -->
                    <div style="display: flex; flex-direction: column; margin-bottom: 10px;">
                        <label class="label-select" for="role">Rol asignado en el sistema:</label>
                        <div class="input-group" style="margin-bottom: 0;">
                            <i class="fa-solid fa-briefcase input-icon"></i>
                            <select id="role" required>
                                <option value="" disabled selected>Seleccione un rol...</option>
                                <option value="director">Director</option>
                                <option value="administrador">Administrador</option>
                                <option value="encargado">Encargado</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" class="btn-primary" onclick="registerUser()">Registrar Usuario</button>
                </form>

                <div style="height: 10px;"></div>
            </div>

            <!-- PANEL DERECHO: Bienvenida Guinda con curva ovalada -->
            <div class="right-panel">
                <div class="welcome-content">
                    <h1>Iniciar Sesión</h1>
                    <p>¿Ya tienes una cuenta?</p>
                    <a href="index.html" class="btn-outline">Inicia sesión aquí</a>
                </div>
                <div class="institutional-text">H. AYUNTAMIENTO 2024-2027</div>
            </div>

        </div>
    </div>

    <!-- LIBRERÍAS DE FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>   
    
    <!-- Vinculación a tu lógica de auth.js existente -->
    <script src="auth.js"></script>
</body>
</html>
